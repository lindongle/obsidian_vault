
#user  nobody;
worker_processes  10;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
	client_max_body_size 1024M;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  300s;
	keepalive_requests 10000;
	send_timeout       300s;

    #gzip  on;

    upstream tcweb { 	
        ip_hash;		
         server 192.168.100.86:7001 weight=2 max_fails=2 fail_timeout=900s;  
         server 192.168.100.96:7001 weight=2 max_fails=2 fail_timeout=900s;			
        }
#web层集群，直接配置为https://tcweb:7001   		
     server {
         listen       7001;
         server_name  localhost;

         #charset koi8-r;

         #access_log  logs/host.access.log  main;

         location / {
             root   html;
             index  index.html index.htm;
	         proxy_pass http://tcweb;
			 #proxy_redirect default;
			 proxy_connect_timeout 900;
			 proxy_read_timeout 900;
			 proxy_send_timeout 900;
			 proxy_set_header Host $host;
			 proxy_set_header X-Real-IP $remote_addr;
			 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			 #proxy_set_header Connection "upgrade";
			 #proxy_set_header Upgrade $http_upgrade;
			 proxy_http_version 1.1;
			 proxy_set_header Connection "";
			 #proxy_http_version 1.1;
			 #proxy_set_header Connection "keep-Alive";
         }
        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
    upstream tcgate {  
        ip_hash;	
        server 192.168.100.86:3000 weight=2 max_fails=2 fail_timeout=900s;  
        server 192.168.100.96:3000 weight=2 max_fails=2 fail_timeout=900s;	
         #keepalive 60;	
         #keepalive_timeout  120;
	     #keepalive_requests 2000;		 
       } 
#https跳转多个http网关集群，直接访问https://plm.cfmoto.com
    server {
        listen       443 ssl;
        server_name  plm.cfmoto.com;
	ssl_certificate /etc/nginx/ssl/cfmoto.com.pem;
	ssl_certificate_key /etc/nginx/ssl/cfmoto.com.key;	
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers  HIGH:!aNULL:!MD5;
	#charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
	        proxy_pass http://tcgate;
			proxy_connect_timeout 200;
			proxy_read_timeout 900;
			proxy_send_timeout 900;
			#proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			#proxy_set_header Connection "upgrade";
			#proxy_set_header Upgrade $http_upgrade;

        }
        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
  #https转发https，不同服务器，直接访问https://plm.cfmoto.com
    server {
        listen       9528 ssl;
        server_name  plm.cfmoto.com;
	ssl_certificate /etc/nginx/ssl/cfmoto.com.pem;
	ssl_certificate_key /etc/nginx/ssl/cfmoto.com.key;	
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers  HIGH:!aNULL:!MD5;
	#charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
	        proxy_pass http://192.168.100.36:9528;
			# --CORS配置
#			add_header Access-Control-Allow-Origin $http_origin;
			add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
			add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
			add_header Access-Control-Allow-Credentials true always;
			if ($request_method = OPTIONS) {
			#	add_header Access-Control-Max-Age 3600 always;
#				add_header Access-Control-Allow-Origin $http_origin;
				add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" ;
				add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
				return 204;
			}


        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
