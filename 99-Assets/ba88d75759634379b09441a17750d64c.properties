# User-configurable properties for the Teamcenter Integration
# for Pro/ENGINEER.
#
# Each property is defined by a name followed by white space or "="
# and a value.  Leading and trailing white space surrounding the value
# will be ignored.  The recognized property names and their default
# values are described below.  Unrecognized property names will be
# ignored.
#
# Comments begin with a "#" character.
#
# If you must include a backslash in a property value, such as in
# a directory path, escape the backslash with another backslash.  For
# example, if the map file is located in C:\ugs\ipem\mymap.xml, the
# "map.file" property should be defined this way:
#
#       map.file = C:\\ugs\\ipem\\mymap.xml
#
# The description of each property below begins with a line that shows
# the property name and the property's default value.  The remaining
# lines of the description explain what the property does and the
# values that can be assigned to it.Most properties can be left unspecified.
#
# Property files may be named "ipem.properties" or ".ipemrc" and
# may be placed in several locations:
#
#       1. In the current directory where the application is started.
#       2. In the user's home directory.
#       3. In the directory where the application is installed.
#
# If more than one file is found, the property definitions take
# precedence in the order listed above.  For example, a property
# defined in an "ipem.properties" file in the user's home directory
# takes precedence over the same property defined in an
# "ipem.properties" file in the installation directory.
#
# A properties file may also specify the path to another properties
# file.  Use the "preferences.file" property to specify the path to
# the other file.  The specified file will be read next, before
# reading the next file from one of the locations above.  If the path
# is not absolute, the file's location is relative to the file that
# has the "preferences.file" property.  For example, the
# ipem.properties file in the installation directory could specify
# another properties file, named "ipem_demo.properties," in the parent
# directory:
#
#  preferences.file = .\\ipem_demo.properties
#
# After reading properties from the installation directory,
# ipem_demo.properties is read before reading properties from the user's
# home directory.  Property values from the specified file may
# redefine values from the file that contains the "preferences.file"
# property.  Only one "preferences.file" property may be used in each
# properties file.
#
# If ipem_demo.properties file specified above does exist then it customizes
# IPEM for demos and user training to enable a "beginner" experience.  Advanced
# customers will want to evaluate the demo preferences, possibly eliminating
# preferences.file setting to the ipem_demo.properties file.
#
# Environment variables may be substituted into a property definition
# using the notation ${NAME}, where "NAME" is the name of an
# environment variable.  For example, if an environment variable named
# "IPEM_DIR" has the value "C:\ugs\ipem", defining the map.file path
# as follows:
#
#       map.file = ${IPEM_DIR}\\mymap.xml
#
# would give the map.file property the value "C:\ugs\ipem\mymap.xml".
# If the environment variable does not exist, no substitution occurs
# and the property definition is left as-is.
#
# A property definition may be locked by adding "/lock" to the end of
# the property name.  For example, the map.file property could be
# locked as follows:
#
#       map.file/lock = C:\\ugs\\ipem\\mymap.xml
#
# Locking the property prevents it from being redefined later.
# Properties files are read in the reverse order from that shown
# above, so properties in the installation directory are read first,
# followed by properties in the user's home directory, then properties
# in the current directory are read last.  A property that has been
# locked in the installation directory cannot be changed by a
# properties file in the user's home directory, and a property that
# has been locked in the user's home directory cannot be changed by a
# properties file in the current directory.  A site administrator who
# does not want users to change certain properties should lock those
# properties in the installation directory's properties file.
#
# -----------------------
# Preferences and Mapping
# -----------------------
# map.file
#       The path to the file containing the mapping data.  If not
#       defined, the mapping file is assumed to be "ipem.xml" in the
#       Teamcenter Integration for Pro/ENGINEER
#       installation directory.  (Note: A copy of "ipem.dtd" should be
#       included in the same directory that contains the mapping file,
#       unless you specify an alternate location for "ipem.dtd" with
#       the mapping file's DOCTYPE tag.)
#
# preferences.file
#       The path to another properties file containing user
#       preferences.  This file will be read next, before reading the
#       next file from one of the standard locations.
#
# ------------
# Pro/ENGINEER
# ------------
# pe.command
#       The command that starts Pro/ENGINEER.  There is no default for
#       this property.  It must be defined if the application runs
#       Pro/ENGINEER in asynchronous mode.  Note:  for Wildfire 2,
#       this should be the absolute path to the Pro/ENGINEER
#       executable, if you do not use a script to start Pro/ENGINEER.
#
# pe.modelcheck = prompt
#       Option that controls whether the ModelCHECK be run prior to
#       saving to Teamcenter. Allowed values are "always", "never" and  
#       "prompt".  The default is "prompt". When the value is "prompt"
#       there will be a checkbox in the save dialog to perform ModelCHECK
#       or not.  If "always" then the ModelCHECK will always
#       be performed without prompting.  If "never", the prompt will
#       not appear and the ModelCHECK will not be performed.
#
# pe.modelcheck.default = false
#       This checks the ModelCHECK option on the save dialog
#
# pe.modelcheck.validtypes = prt:asm:drw
#       This option defines the types of Pro/ENGINEER models to be
#       passed to ModelCHECK.
#
# pe.modelcheck.show.report = false
#       Option to show the ModelCHECK results into the Pro/ENGINEER web
#       interface. Default value is false, indicating not to show results.
#       If this option is set to true then pe.modelcheck.output option 
#       should be set to the path of the directory where the generated
#       reports will be stored. The reports will be displayed in the Pro/E web 
#       browser in the respective windows of the models which are open.
#
# pe.modelcheck.show.graphics = false
#       This activates user interactions.  The default is "false" which
#       performs a single level ModelCHECK on each selected model.  If set
#       to "true", an interactive ModelCHECK is performed on each top
#       level assembly.  The user can then use the Pro/ENGIEER dialog
#       to select "Top Level", "Number of Levels" or "All Levels".  Interactive
#       ModelCHECK provide better details of errors, but is cumbersome to
#       use during save to Teamcenter. The recommended practice is to set this
#       preference to false to avoid the cumbersome usage.  When a error
#       is identified during save to Teamcenter, the user should cancel his save
#       and run the interactive ModelCHECK from within Pro/ENGINEER session.
#       Using the details of the interactive execution in Pro/ENGINEER, the user
#       should correct the failures before executing the save to Teamcenter
#       again.
#
# pe.modelcheck.errors.max = 0
#       Option that defines the maximum number of errors returned
#       from ModelCHECK to allow save to Teamcenter.  Default is zero
#       which means allow no errors on save.  A value of -1 indicates infinite
#       errors are acceptable.
#
# pe.modelcheck.warnings.max = -1
#       Option that defines the maximum number of warnings returned
#       from ModelCHECK to allow save to Teamcenter.  Default is negative
#       one, meaning infinite number of warnings allowed to save.  A value of
#       -1 indicates infinite warnings are acceptable.
#
# pe.modelcheck.config = C:\\1\\modelcheck
#       This is the directory where ModelCHECK parameters to be found in
#       "config" subdirectory. Copy the "config" folder from the
#       PROE_DIR\modchk\text\usascii directory to the directory pointed by
#       "pe.modelcheck.config" preference. If the folder specified does not
#       exist, then a "ModelCHECK exception" will occur.
#
#       In the global ModelCHECK config_init.mc, MODE_RUN must be set to Y
#       for "B" or batch mode.
#
# pe.modelcheck.output = C:\\1\\modelcheck\\output
#       Option controls the output directory for the ModelCHECK report
#       files.The directory folder specified by this option should exists.
#       The  option pe.modelcheck.show.report=true will not work when this
#       option is not set.
#
# pe.timeout = 90
#       Number of seconds for the Pro/ENGINEER disconnect timeout.
#       Allowed value is a positive integer.  This option is used
#       only if the application runs Pro/ENGINEER in asynchronous
#       mode.
#
# pe.units.length = inch
#       Default units of length for Pro/ENGINEER models when using
#       Pro/ENGINEER 2001 (this option is ignored when using
#       Pro/ENGINEER Wildfire).  Allowed value is any keyword allowed
#       for pe.units.length.reference.  Alternatively, this value may
#       be a real number to create a user-defined unit of length.  The
#       number is understood to be the number of reference units per
#       user-defined unit, where reference units are given by
#       pe.units.length.reference.  For example, to use angstroms
#       (1 angstrom is 1e-10 meters) by default, set
#       "pe.units.length = 1e-10" and define the reference units with
#       "pe.units.length.reference = m".
#
# pe.units.length.reference = inch
#       Reference units of length for user-defined units.  All
#       user-defined units are specified with respect to this
#       predefined unit.  Allowed value is one of the following
#       keywords:
#               micron
#               mm
#               cm
#               m
#               mil
#               inch
#               foot
#       For example, if the default unit of length for models should
#       be angstroms (1 angstrom is 1e-10 meters), it can be defined
#       with respect to meters by setting "pe.units.length = 1e-10"
#       and "pe.units.length.reference = m".  This option is used
#       only for user-defined units.
# 
#  pe.checkout.reminder = true
#       This preference is used to enable the checkout reminder of models.
#       The default of true causes a checkout reminder dialog to appear when
#       the user modifies a model in Creo.  When set to false, users are not
#       asked to checkout the model when attempting to modify a model. Setting
#       the value to true prevents users from useing the Creo undo and redo
#       capabilities.
#
# titlewindow.x = 0
# titlewindow.y = 0
#       Screen location of the window that the titlewindow.show option
#       controls.  Allowed values are integer screen locations.  If
#       this location is off screen, the location is adjusted to keep
#       the top-left corner on the screen.
#
# window.alwaysOnTop = false
#       When set to true, Integration Windows will be the top most Window
#       of all applications.
#
# ----------------------
# Teamcenter
# ----------------------
#iman.autorename.bomrevisionrule = Precise Only



#       Revision rule that configures the relationships when the ipemrename
#       utility fetches and saves models.  This rule should yield the "as stored"
#       relationships to ensure the parent Item Revisions still reference the
#       original revisions of the model being renamed.  Using an imprecise
#       revision rule such as "Latest Working" will result in all parent
#       revisions referencing the latest revision of the renamed model once
#       the ipemrename operation is complete.
#
# iman.autorename.itemid = true
#       Option that controls whether an item's ID is automatically
#       changed to match the Pro/ENGINEER model name when the model is
#       renamed by the ipemrename utility.  Allowed value is true or
#       false.  When true, an item ID that matches the model's old
#       name is automatically changed to match the new name.  When
#       false, the item ID does not change automatically when
#       ipemrename changes the model name.
#
# iman.autorename.itemname = false
#       Option that controls whether an item's name is automatically
#       changed when the ipemrename utility changes the name of a
#       Pro/ENGINEER model, or when an item ID is changed in the Save
#       dialog.  Allowed value is true or false.  When true, an item
#       name that matches the model's old name is automatically
#       changed to match the model's new name when the ipemrename
#       utility renames a model; and an item name that matches the
#       item's old ID is automatically changed to match the new ID if
#       the item ID is changed in the Save and Manage New dialog.
#       When false, the item name does not change automatically when
#       the model name or item ID changes.
#
# iman.autorename.other = true
#       Option that controls whether "other" objects in an item or
#       item revision are automatically renamed when the ipemrename
#       utility changes the name of a Pro/ENGINEER model.  Examples of
#       "other" objects are forms and non-Pro/ENGINEER datasets.
#       Allowed value is true or false.  When true, an object name
#       that matches the model's old name is automatically changed to
#       match the new name.  When false, the names of other objects do
#       not change automatically when ipemrename changes the model
#       name.  The rule for deciding whether a model name matches
#       another object's name is set by the
#       iman.autorename.other.exactlength option.
#
# iman.autorename.other.exactlength = false
#       Option that determines how to match names when the
#       iman.autorename.other option allows datasets, forms, and other
#       objects to be renamed.  Allowed value is true or false.  When
#       deciding whether a Pro/ENGINEER model name matches the name of
#       an object in Teamcenter, true means the names match if they
#       are exactly the same length and if they match character-for-
#       character, ignoring case.  False means the names match if the
#       object's name starts with the model name, ignoring case.  For
#       example, suppose a model is named "WIDGET" and
#       iman.autorename.other.exactlength is true.  A dataset named
#       "WIDGET" would match the model name, but a dataset named
#       "WIDGET/A" would not match the model name.  If
#       iman.autorename.other.exactlength is false, "WIDGET/A" would
#       also match the model name.
#
# iman.bomrevisionrule.latest
#       Revision rule that determines which revision of an item is the
#       latest.  Allowed value is the name of a Teamcenter revision
#       rule, such as Latest by Alpha Rev Order.  If not specified,
#       Teamcenter's built-in criteria are used to determine the
#       latest revision.  This affects the table column that indicates
#       whether a later revision of a model is available: the column
#       displays an icon when the model in the table belongs to a
#       revision that is not the latest.
#
# iman.maxOperationBracketTime = 1200
#       The maximum time in seconds that an integration server 
#       call could take.The server will keep the call bracketing
#       open as long as there are additional updates within the
#       time provided.  Making the time too short (such as 
#       Teamcenter default of 500) can result in call brackets 
#       expiring and result in negative performance.  The recomended
#       value is 20 minutes (1200 sec).  This setting is specific 
#       to the integration, it does not impact other Teamcenter clients.
#
# iman.maxOperationBracketInactiveTime = 120
#       The maximum time that Teamcenter must wait on an operation call 
#       braket. This accounts for time integration could be interacting
#       with CAD system or possibly waiting on some user dialogs.  
#       Default value is 2 minutes.  An unset value means use the Teamcenter
#       values.  This setting is specific to the integration, it does not
#       impact other Teamcenter clients.
#
# ----------------------
# Cancel Checkout Dialog
# ----------------------
#
# cancelcheckout.height = 500
#       Default height for the Cancel Checkout dialog, in pixels.
#
# cancelcheckout.width = 1000
#       Default width for the Cancel Checkout dialog, in pixels.
#
# table.columns.cancelcheckout
#       List of columns to display in the Cancel Checkout dialog.
#       Allowed value is a colon-separated string of names, as
#       described under the table.columns.std option.  If not
#       specified, the columns given by table.columns.std are used.
#
# -----------
# Save Dialog
# -----------
# checkin.after = keep
#       Default "After Save" option for the Save dialog when using the
#       "Save", and "Save All" commands.  Allowed values are "checkout",
#       "delete", "keep", and "readonly".  The default value is "keep"
# 
# checkin.cadversion.ignore = always
#       Option that controls whether the save operation can proceed
#       when some models that have not been selected for saving appear
#       to have changes that have not been saved to Teamcenter.
#       Allowed values are "always", "never" and "prompt".  If
#       "always", a save operation can proceed regardless of whether
#       any models in the Save dialog appear to have changes that will
#       not be saved to Teamcenter.  If "never", the save operation
#       cannot proceed if a model in the Save dialog appears to have
#       changed and is not selected for saving to Teamcenter.  If
#       "prompt", the user is asked whether to proceed with the save
#       operation when models that appear to have changed are not
#       selected for saving.  Note that these tests concern only
#       models shown in the Save dialog.  Other local models that may
#       have unsaved changes, but which are not included in the Save
#       dialog, will be ignored.  Note also that the
#       "checkin.cadversion.ignore.all" option determines whether
#       these tests for unsaved changes apply to all models in the
#       Save dialog, or only those models that directly reference or
#       are direct dependencies of the models selected for saving.
#
# checkin.cadversion.ignore.all = true
#       Option that determines whether tests for models with changes
#       that will not be saved to Teamcenter are applied to all models
#       in the Save dialog, or only the models that directly reference
#       or are direct dependencies of the models selected for saving.
#       Allowed values are "true" to test all models, and "false" to
#       test only the models that directly reference or are direct
#       dependencies of the models selected for saving.
#
# checkin.cadversion.drawing.dependencies = always
#       Option that controls whether the save operation can proceed
#       when all the dependent models of drawing are not selected
#       for saving.  Allowed values are "never", "always" and "prompt"
#       If "never", then save continues even if all dependent models of
#       drawing are not selected for saving. If "always", then save
#       operation only proceeds if all dependent models of drawing
#       are selected for saving. If "prompt", the user is asked
#       whether to proceed with the save operation when all dependent
#       models of drawing are not selected for saving.  The default value
#       is "always" because modifying a drawing in Pro/ENGINEER can
#       modify a dependency.  If a site chooses to use "never" or "prompt"
#       the recomendation is set "draw_models_read_only yes yes" in the
#       sites config.pro file. Relationships to Pro/ENGINEER formats are
#       are ignored "dependent models" check.
#
# checkin.height = 500
#       Default height for the Save dialog, in pixels.
#
# checkin.width = 1000
#       Default width for the Save dialog, in pixels.
#
# checkin.ignoremissing = prompt
#       Option that controls whether the save operation can proceed
#       when a model selected for saving depends on another model that
#       is not in the Pro/ENGINEER session and not in Teamcenter.
#       Allowed values are "always", "never" and "prompt".  When
#       "always", the save operation is always allowed to proceed
#       regardless of whether any dependencies are missing.  When
#       "never", the save operation cannot proceed if any model
#       selected for saving depends on another model that is not in
#       Pro/ENGINEER session and not in Teamcenter.  When "prompt",
#       the user is asked whether to proceed with the save operation
#       when dependencies are missing.
#
# checkin.model.preview = true
#       This preference controls the display of preview when user hovers mouse
#       over the Object column of the save dialog.  When true
#       a preview of the model will be displayed when hovering over the column.
#       If set to false, the preview will not be displayed.
#
# checkin.modelname.show = true
#       This preference controls if the Pro/ENGINEER model name field is shown
#       in the Register New and Save dialogs.  If false, the model name field 
#       does not appear on the dialogs.  When false, Register New will result
#       in a model name same as Item ID.  The Save dialog will handle
#       model name according to the autorename preference settings. If set
#       to true, the model name field appears on the dialog.  When true, the
#       value will be populated with default values but the user can modify
#       the value.
#
# checkin.pdmversion.ignore = prompt
#       Option that controls whether the save operation can proceed
#       when models already in Teamcenter appear to have changed since
#       since they were fetched.  Allowed values are "always", "never"
#       and "prompt".  If "always", a save operation can proceed
#       regardless of whether any models in the Save dialog appear to
#       have newer versions in Teamcenter.  If "never", the save
#       operation cannot proceed if a model in the Save dialog has a
#       newer version already in Teamcenter.  If "prompt", the user is
#       asked whether to proceed with the save operation when newer
#       model versions are detected in Teamcenter.  Note that the
#       "checkin.pdmversion.ignore.all" option determines whether
#       tests for newer versions in Teamcenter apply to all models in
#       the Save dialog, or only those models that are selected for
#       saving.
#
# checkin.pdmversion.ignore.all = false
#       Option that determines whether tests for newer versions of
#       models in Teamcenter are applied to all models in the Save
#       dialog, or only those models that are selected for saving.
#       Allowed values are "true" to test all models, and "false" to
#       test only the models selected for saving.
#
# checkin.require.unique.dataset = false
#       Option that controls whether Save validates that new models 
#       create unique dataset names and types in Teamcenter. If set 
#       to true, a model being saved to a new Item Id will not be 
#       able to be saved if the dataset name and type exist in 
#       Teamcenter for an existing Item Id. If set to false, no 
#       validation will be performed. It should be noted that the 
#       validation is for a single site. The Teamcenter ODS is not 
#       checked. Thus duplicate dataset names and types can occur 
#       across sites.
#
# checkin.familytable.deleteinstance = never
#       Option that controls whether IPEM will allow the user to save a 
#       family table to Teamcenter when one or more "orphaned instances" are
#       detected.  An orphaned instance is a family table instance in Teamcenter
#       referenced to an Item or ItemRevision but which instance does not 
#       exist in the family table of the Pro/ENGINEER model currently being saved.
#       This condition results when a user either renames or removes 
#       a family table instance from a CAD file's family table. Allowed values
#       for this preference are "never" or "prompt".   If "never", then 
#       IPEM will prevent the save of a generic if an instance that exists
#       in Teamcenter nolonger exists in the generic's familytable.  The user
#       provided a dialog listing the deleted instances.  If "prompt", then IPEM 
#       will warn the user, and user can choose to proceed with the save.
#       Default value is "never".
#
#       Should, a user may wish to convert a family table instance into a
#       standalone part the conversion can still be completed even though the
#       the user must remove the instance from the generic's family table.
#       The following guidelines must be followed to convert without error:
#       A value of "always" may be specified in extreme cases where saving 
#       huge family tables becomes a severe performance problem.  However, 
#       this value is not recommended.  It will bypass the checking of 
#       inconsistent family tables."
#
#          1.  The generic and the instance (to be converted to standalone) 
#              are both checked out by the user.
#          2.  The generic and the instance (to be converted to standalone)
#              are both brought into the Pro/ENGINEER session.
#          3.  The instance is removed by deleting the appropriate row in 
#              the family table of the generic's Pro/ENGINEER model 
#          4.  The user should then notice a message in the Pro/ENGINEER window
#              status field that the instance is no longer table driven
#          5.  The save operation is performed with the "Save All" 
#              Teamcenter menu option.
#          6.  The user verifies that both the generic and the instance (to be
#              converted to a standalone part) are present on the Save dialog before 
#              the save operation is completed.
#
# checkin.familytable.savenested = true
#       Option that controls whether the a family table which contains
#       nesting may be saved to Teamcenter.  Allowed values are 
#       "true" and "false".  If "true", then a family table may be saved 
#       to Teamcenter regardless of whether the it contains nested
#       family tables or not.  If "false", then a family table may not
#       be saved to Teamcenter.  Default value is "true".
#
# checkin.familytable.requireall = never
#       Option that controls whether the complete family table must be 
#       saved to Teamcenter whenever a member of the family table
#       is saved.  Allowed values are "always" and "never". If "always", a
#       save operation cannot proceed when a family table member is 
#       selected for saving until all family table members are also 
#       selected for saving.  If "never", the user may checkin a family 
#       table member without saving the complete family table to 
#       Teamcenter.
#
# checkin.arrangements = false
#       Option that controls whether the arrangements should be saved
#       on check in of BOMs. Allowed values are "true" and "false". Default
#       value is "false". If set to false, the user will be 
#       unable to open user defined simplified representation where 
#       the down load of files is limited by the arrangement.
#
# checkin.arrangements.ignore = Default Rep
#       List of arrangements which should not be saved to Teamcenter where the 
#       uses : as the list separator (e.g. Default Rep:Dummy Rep). Default is
#       is to ignore the "Default Rep" which is localized.
#       These are Pro/E user defined simplified representation that
#       the integration should NOT save to Teamcenter. String case is 
#       ignored (e.g. "DUMMY REP" and "dummy rep" are considered to be
#       the same). If the active arrangement is one of the ignored arrangements,
#       no arrangement data will be saved to Teamcenter. 
#
# eai.jtenabled = false
#       Default value for the "Save JT Files" option in the Save
#       dialog.  Allowed values are true and false.  If true, JT
#       files will be generated and/or saved to Teamcenter
#       as directed by the auxiliary file map.  If false, JT entries
#       in the auxiliary file map are ignored.
#
# iman.addonlynewtoselected = true
#       Option that determines whether only new items, or all items,
#       are added to a user-selected folder during a save operation.
#       Allowed values are true and false.  When true, items are added
#       to the user-selected folder only if they are created during a
#       save operation.  When false, all items that are saved are
#       added to the user-selected folder.
#
# iman.autorename.familytable = prompt
#       Option that controls whether all members of a family table are
#       included in an operation that changes item ID.  Allowed values
#       are "always", "never", and "prompt".  When "always", changing
#       the item ID of any family table member in the Save dialog
#       always includes the other members of the family table in the
#       operation, making it possible to assign new item IDs to all
#       members of a family table in one operation (family table
#       instances that are not in session will be regenerated).  When
#       "never", changing the item ID of a family table member in the
#       Save dialog never brings other members of the family table
#       into the operation.  When "prompt", the user will be asked
#       whether the other family table members should be included when
#       changing any family table member's item ID.  This option only
#       applies to item IDs assigned with the "New" and "Replace"
#       buttons.  Changing a family table member's item ID by typing a
#       new ID directly into the item ID column affects only that
#       model, regardless of how this option is set.
#
# iman.autorename.model = prompt
#       Option that controls whether a model is renamed when its
#       item ID changes.  Allowed values are "always", "never", and
#       "prompt".  When "always", changing an item ID in the Save
#       dialog always renames the model to match the new item ID.
#       When "never", changing an item ID in the Save dialog never
#       renames the model.  When "prompt", the user will be prompted
#       to decide whether to rename the model to match a new item ID.
#       The model can also be renamed with something other than the
#       new item ID if a pattern other than "{item_id}" is assigned
#       to the iman.autorename.model.pattern option.
#
# iman.autorename.model.pattern = {item_id}
#       Pattern to use for renaming a model when its item ID changes,
#       if iman.autorename.model is "always" or "prompt".  Allowed
#       value is a string to use for the model's new name.  The string
#       may include substitution keywords from the following list:
#               {item_id}          Replaced by the model's new item ID.
#               {item_name}        Replaced by the model's item name.
#               {cad_suffix}       Replaced by the matching cad_suffix.
#       For example, the default pattern "{item_id}" causes a model to
#       be renamed to match its Teamcenter item ID, while a pattern such
#       as "{item_id}-{item_name}" would rename a model using its item
#       ID and item name.  In the latter case, a model assigned a new
#       item ID "P1234567" and whose item name is "BRACKET" would be
#       renamed to "P1234567-BRACKET".
#
# iman.autorename.model.pattern.cad_suffix.match =
#       Option to use for renaming a CAD model when its item ID changes
#       and when iman.autorename.model.pattern option contains {cad_suffix}
#       keyword. This pattern is used to get matching cad_suffix string 
#       from the CAD name. Allowed value is the constant string to use  
#       as a suffix for the model name. 
# iman.autorename.dwg.pattern.match.itemid.len = 
#       Option to use for validating item id naming of drawing and its 
#       dependent models. This option is used to have same item id of
#       drawing and its dependent models upto the length mentioned.
#       Allowed value is the constant string to use as a comparison 
#       limit for drawing and its dependent model item ids.
#
# iman.autorevise.familytable = prompt
#       Option that controls whether new revision IDs are assigned to
#       all members of a family table when any member of the family
#       table is assigned a new revision ID.  Allowed values are
#       "always", "never", and "prompt".  When "always", changing the
#       revision ID of any family table member in the Save dialog
#       always changes the revision ID of the other members of the
#       family table, making it possible to assign new revision IDs to
#       all members of a family table in one operation (family table
#       instances that are not in session will be regenerated).  When
#       "never", changing the revision ID of a family table member in
#       the Save dialog never assigns new revision IDs to other
#       members of the family table.  When "prompt", the user will be
#       asked whether the other family table members should be
#       included when assigning a new revision ID to any family table
#       member.  This option only applies to revision IDs assigned
#       with the "New" button.  Changing a family table member's
#       revision ID by typing a new ID directly into the revision ID
#       column affects only that model, regardless of how this option
#       is set.
#
# iman.bomrevisionrule.checkin = Latest Working
#       Revision rule that configures the BOM when saving an assembly.
#       Allowed value is the name of a Teamcenter revision rule.  This
#       rule should yield the "as stored" BOM as nearly as possible,
#       i.e. if the BOMView revision (BVR) is precise, the rule should
#       select those precise revisions and no others.  The revisions
#       selected by this rule will be compared to the assembly's
#       current structure in Pro/ENGINEER to determine whether the BOM
#       requires updating when the assembly is saved to Teamcenter.
#       In most cases, this option should not be changed from its
#       default value unless your site has modified the "Latest
#       Working" rule, renamed it, or deleted it.  If you do change
#       this option, the revision rule you use should begin with a
#       "Precise" clause to select precise revisions whenever
#       possible.
#
# iman.datasetdescdefault = From iPEM
#       Default description to save with datasets. The value is set
#       on new datasets or datasets without a description. Allowed value
#       is any string.
#
# iman.folderdescdefault = From iPEM
#       Default description to save with new folders.  Allowed value
#       is any string.
#
# iman.itemdescdefault = From iPEM
#       Default description to save with items. The value is set on
#       new items or existing items without a description. Allowed value
#       is any string
#
# iman.itemid.preview = XXXXXX
#       Dummy item ID to use when previewing new item IDs in the
#       Replace Item ID dialog, before an actual ID is generated.
#       Allowed value is any string.
#
# iman.itemrevdescdefault = 
#       Default description to save with item revisions. The value is
#       set on new item revisions or item revisions without a description.
#       Allowed value is any string. A value of empty string saves the item
#       description to the item revision description. The default setting
#       is empty string.
#
# iman.itemtypedefault.saveas = existing
#       Controls the default item type when duplicating an item in the save
#       dialog. Allowed values are "existing" and "default".  When set to
#       "existing" the item type of the duplicated object will not be changed
#       from its current value.  When set to default, the item type of the
#       duplicated object will be changed to match the type specified by the
#       dataset_map.  To clarify, duplicating in the save dialog refers to
#       the process of assigning a new Item ID via the Item ID New and 
#       Replace buttons, or manual setting of the Item ID within the Item
#       ID column.
#
# iman.precisebom = true
#       Default for whether BOMs will be precise or imprecise.
#       Allowed values are true and false.  If true, BOMView revisions will
#       be precise; if false, BOMView revisions will be imprecise.
#
# iman.preciseisimprecise.familytable = false
#       Default value for the "Apply rule to precise family tables"
#       option in the Open dialog.  Allowed values are true and false.
#       If false, precise relationships are used as-is, i.e. when an
#       instance model depends on a specific generic item revision because
#       of a precise relationship, that item revision is what will appear
#       in the Open dialog.  If true, the specific item revision given by
#       a precise relationship is ignored, and instead the BOM revision
#       rule is applied to the item to determine which item revision to
#       show in the Open dialog
#
# pe.displaywait = 1
#       Number of seconds to wait for Pro/ENGINEER to display a model
#       in a window.  Allowed value is a positive integer.  This
#       option is used when saving auxiliary files that include a
#       "plot" command.  These commands require a model to be
#       displayed, otherwise an error will occur.  If necessary, the
#       Manager will create a temporary window to display a model
#       before executing a "plot" command.  This option tells the
#       Manager how long to wait for the temporary window to display a
#       model before proceeding with the "plot" command.
#
# pe.udf.enable = true
#        This option enables or disables the processing of UDF 
#        (user defined feature) models. The default value of true 
#        enables the processing of UDF files while saving the target 
#        models in which UDF is placed and also enables the Insert UDF 
#        operation. Setting a value of false disables udf processing support.  
#        Setting this value alone is not sufficient to configure UDF 
#        functionality. Configuration of ipem.xml is also required.  
#        See the IPEM Users Guide.
#
# table.columns.checkin = itemid:itemrev:genericname:reservedby:releasestatus
#       List of columns to display in the Save dialog.  Allowed value
#       is a colon-separated string of names, as described under the
#       table.columns.std option.  The following column must be specified
#       via table.columns.checkin as it only applies to checkin.
#
#			    saveaction        Enables the save action column.  The save action
#                           columns indication the action performed on models
#                           selected for save. The actions are the following:
#
#                           Save New  A new item will be created in Teamcenter
#                           Revise    A new revision of an existing model
#                                     will be created in Teamcenter
#                           Save      Model will be saved to an existing Item
#                           Save As   An existing model is being saved to
#                                     a new Item.
#
#           workflow        Enables the workflow column and the workflow
#                           checkbox to submit to a workflow.  When the box is
#                           checked, the Item Revision will be submitted to the
#                           workflow shown in the column when saved.  The list
#                           of workflows is configurable using allowed_workflows
#                           in the dataset mapping.  For more information see
#                           the AdminGuide.pdf.
#
# checkin.deferredrename.enable = true
#       Preference to validate data created by Teamcenter Duplicate and
#       Teamcenter Rename (Pro/ENGINEER->Rename) actions can be saved back into
#       Teamcenter.  If set to true, it is safe to use the actions within the
#       Teamcenter Rich Client.  Setting the value to true is a performance
#       impact on every save operation.  Once a Teamcenter Duplicate or Teamcenter
#       Rename action is performed this preference must remain forever true.
#       Additionally checkout.deferredrename.enable must be true too.
#       If set to false, the Teamcenter Duplicate and Teamcenter Rename actions
#       should not be used or some data will not save to Teamcenter correctly.
#       In IPEM 10.1.0 release Teamcenter Rename was replaced with actions
#       that do not create deferred rename conditions so data can be saved
#       with this preference set to false.  In a future release the Teamcenter
#       Duplicate actions will be replaced by actions that do not create
#       deferred rename conditions and will not require this preference to be
#       set to true.  If this preference was set to false while using a release
#       prior to 9.1.1, the ipem_upgrade_database utility must be run before
#       setting this preference to true.  
#
# checkin.owner.integration.ignore = false
#       This preference controls if models can be saved to existing Teamcenter
#       Item Revisions that could be owned by another integration. Ownership of
#       an Item Revision is determined by the presense of an integration
#       specific dataset. For the Pro/ENGINEER integration those datasets are
#       Pro* (ProAsm, ProPrt, ProDrw).  The default setting of false prevents
#       saving models to existing Item Revisions that do not contain a
#       Pro/ENGINEER integration dataset.  A value of true allows saving models
#       to all Item Revisions even those owned by other integrations.  It is
#       safest to use a setting of false.
#
# checkin.propertiespanel.width = 0.35
#       This preference controls the default width of the properties panel on the save dialog.
#       The value is a ratio of the overall save dialog width. Valid values are between
#       0.2 and 0.5.  The default value is 0.35.
# 
# checkin.silent.enable = true
#       This preference controls the appearance of the save dialog when the
#       user selects the save menu.  When set to true, the dialog will not
#       appear if all modified models are checked out.  The models will be
#       saved to Teamcenter.  When set to false, the dialog will always appear
#       and user will have option to make changes.  The default is true.
#
# -----------
# Open Dialog
# -----------
# checkout.advancedsearch.height = 400
#       Default height for the Advanced Search dialog, in pixels.
#
# checkout.advancedsearch.width = 400
#       Default width for the Advanced Search dialog, in pixels.
#
# checkout.autosave.attributes = true
#       Preference that specifies whether to automatically save the model
#       locally at the end of the open operation. With the default setting of
#       true, the models are saved.  When set to false, the models are not
#       saved, the user must remember to save the model to preserve any
#       attribute mapping that occurred.  If structure syncing was done as part
#       of updating an assembly from BOM, than the synced models are saved
#       without consideration of this preference.  The saving of models can
#       be a significant performance impact (20-40% of open time) so a setting
#       of false may significantly help open operation performance at some sites.
#       Consider setting prompt_on_exit=yes in config.pro if setting this
#       preference to false.
#
# checkout.conflict.delete.closed = never
#       Option that controls whether to delete files from the
#       destination directory when they conflict with files to be
#       exported from Teamcenter.  Allowed values are "always" and
#       "never".  If "always", conflicting files in the
#       destination directory are silently deleted so files can be
#       exported from Teamcenter.  If "never", conflicting files are
#       not deleted from the destination directory, and the
#       corresponding models in Teamcenter are not exported.  This option
#       only applies when the Open Dependencies dialog is not displayed.
#
# checkout.deferredrename.enable = true
#       Preference to open data created by Teamcenter Duplicate and
#       Teamcenter Rename (Pro/ENGINEER->Rename) actions.  If set to true, it
#       is safe to use the Teamcenter Rich Client actions.  Setting the value
#       to true is a performance impact on every open operation performed. Once a
#       Teamcenter Duplicate or Teamcenter Rename action is performed this
#       preference must remain forever true.  Additionally
#       checkin.deferredrename.enable must be true. If set to false, the
#       Teamcenter Duplicate and Teamcenter Rename actions should not be used
#       or some data will not open correctly into Pro/ENGINEER.  
#       In IPEM 10.1.0 release Teamcenter Rename was replaced with actions
#       that do not create deferred rename conditions so data can be saved
#       with this preference set to false.  In a future release the Teamcenter
#       Duplicate actions will be replaced by actions that do not create
#       deferred rename conditions and will not require this preference to be
#       set to true.  
#
# checkout.dependencies.default = true
#       Option that controls the default of value for "show dependencies"
#       checkbox on open dialog and the appearance of dependencies for
#       update and manager operations.  If true, the "show dependencies"
#       check box is checked when open dialog appears and update and
#       manager operations will show dependencies when additional
#       dependencies are being retrieved, if false the checkbox is
#       unchecked on open dialog and dependencies dialog will never appear
#       for update and manager operations.  A value of true is the default.
#
# checkout.dic.enable = true
#       This option enables the translation of JT files generated by other
#       applications into Pro/ENGINEER parts.  The process is refered to
#       as Design in Context or Multi-CAD.  The default value of true
#       enables design in context support while opening.  Seting a value
#       of false disables design in context support.  Design in context is only
#       supported for limited operations and data scenarios.  Refer to the
#       AdminGuide.pdf.  Sites without Multi-CAD should set
#       checkout.dic.enable = false to improve performance.
#
# checkout.dic.nx.default.jt.name = MODEL$
#        Specifies the NX JT file name for BREP geometry JTs.  NX integration to 
#        Teamcenter may store more than one JT file in the dataset.  By default, 
#        the NX file name containing the BREP geometry is MODEL$.jt.  NX has a 
#        site preference which can be configured to change the default filename 
#        for the BREP model jt. This preference should contain the same filename as 
#        the NX default filename for the BREP model jt.  This preference only works 
#        for JT datasets created with NX4 or later.  This preference is in effect 
#        only when checkout.dic.enable = true. For all other CAD integrations, the 
#        assumption is that only a single JT is stored and that the name is unique 
#        across all items and persistent for all item revisions within an item.
#
# checkout.height = 600
#       Default height for the Open dialog, in pixels.
#
# checkout.width = 1000
#       Default width for the Open dialog, in pixels.
#
# checkout.exportdirectory
#       Default path to the "Destination Directory" in the Open
#       dialog.  If not given, or if no value is assigned, the default
#       destination directory for files exported from Teamcenter.
#       is Pro/ENGINEER's current working directory.
#
# checkout.familytable.requireall = never
#       Option that controls whether to fetch or check out an entire
#       family table when any member of the family table is checked out.
#       Allowed values are "always" and "never".  If "always", then 
#       checkout or fetch of a member of the family table will cause 
#       all members of the family table to be checked out or fetched.
#       If "never", then fetch or checkout of all family table members
#       is not required when any member of the family table is fetched
#       of checked out.  If the value is "always", then this option overrides
#       the setting of either checkout.requiregeneric.open or 
#       checkout.requiregeneric.closed.
#
# checkout.info.prompt = true
#       Option that controls whether the user will be prompted to
#       enter a comment for models that are checked out.  Allowed
#       values are true and false.  When true and at least one model
#       has been selected to check out, the "Checkout Comments" dialog
#       will appear after the Open dialog or Open Dependencies dialog
#       closes.  When false, the "Checkout Comments" dialog does not
#       appear, which means the user cannot enter comments when
#       checking out models.
#
# checkout.levels.enable = false
#       A preference to control the appearance of the levels text box into the open and open
#       dependencies dialogs.  The default value is "false", meaning the levels text box will
#       not appear.  If set to true, the levels text box will appear and the user can enter an
#       integer value.  When an integer value is entered only that many levels of the structure 
#       will be shown in the open dependencies dialog.  So entering 3 into the box will limit
#       the open dependencies to showing the first three levels of models under an assembly
#       or drawing.  If the number is changed on the open dependencies dialog, then selecting
#       the apply button will update the table to show the new number of levels.
#
# checkout.window.limit = 5
#       The number of separate Pro/ENGINEER windows that can be
#       created in a single open operation without issuing a warning
#       to the user.  If the number of windows to open exceeds this
#       number, the user will be asked to confirm that this is
#       intended.
#
# checkout.updatefrombom = false
#       Option that controls whether assemblies are updated to match
#       their BOMs when they are opened in Pro/ENGINEER.  This sets
#       the initial value of the "Update Assembly from BOM" checkbox.
#       Allowed values are true and false.
#
# checkout.updatefrombom.bomline.delete = preserve
#       Option that controls whether an assembly component that is no
#       longer in the BOM will be deleted or suppressed when the
#       assembly is updated to match the BOM.  Allowed values are "delete" 
#       or "preserve".  If "delete", an assembly component that is not in 
#       the BOM will be deleted from the assembly.  If "preserve", a 
#       component that is not in the BOM will be suppressed.  
#
# filters.checkout.choices = Required:Include Drawings


#       List of filters to display in the "Filters" box.  Allowed
#       value is a colon-separated string of filter names from the
#       list below.  The "Filters" box will have a checkbox for each
#       filter specified in this list.  The list also specifies the
#       order in which the filters will be applied, if several filters
#       are checked by the user.  For example, if the "Custom" filter
#       appears in the list after the "Required" filter and the user
#       checks both checkboxes, the "Custom" filter will be applied
#       last; if the "Required" filter excludes a model and the
#       "Custom" filter adds it, the "Custom" filter will override the
#       "Required" filter's action.
#               Assemblies Only         Excludes any model that is not
#                                       an assembly.
#               Custom                  The custom filter configured with
#                                       the "Edit" button.
#               Implied                 Includes "implied dependencies," i.e.
#                                       models in the same item revision.
#                                       (The "Required" filter excludes
#                                       implied dependencies.)
#               Implied by Top          Includes models in the same item
#                                       revision as a model at the top of
#                                       the hierarchy.
#               Notebooks               Adds notebook models (.lay), otherwise
#                                       it does not change any previous
#                                       filter's action.  (The "Required"
#                                       filter excludes notebook models.)
#               CEMs                    Adds layout models (.cem), otherwise
#                                       it does not change any previous
#                                       filter's action.  (The "Required"
#                                       filter excludes layout models.)
#               No Drawings             Excludes implied drawings from the
#                                       collection.  "implied drawings" are
#                                       those in the same item revision.
#               Include Drawings        Includes drawings referencing models
#                                       in the collection.  The drawings
#                                       included included "implied" and those
#                                       in their own items.  "No Drawings" and
#                                       "Include Drawings" are not supported
#                                       for simultaneous use.  Drawings with
#                                       dependencies to models not included in
#                                       the collection are not included
#                                       by the filter.  
#               No Implied              Excludes "implied dependencies," i.e.
#                                       models in the same item revision.
#               None                    Excludes all models from the
#                                       collection, other than those at
#                                       the top of the hierarchy.
#               Part to Assembly        Adds an assembly model if it is
#                                       referenced by a part, otherwise
#                                       it does not change any previous
#                                       filter's action.  (The "Required"
#                                       filter excludes part to assembly
#                                       relationships.)
#               Part to Part            Adds a part model if it is
#                                       referenced by a part, otherwise
#                                       it does not change any previous
#                                       filter's action.  (The "Required"
#                                       filter excludes part to part
#                                       relationships.)
#               Referenced by Generic   Adds a model if it is referenced by
#                                       a family table generic, otherwise
#                                       it does not change any previous
#                                       filter's action.
#               Referenced by Top       Adds a model if it is referenced by
#                                       a model at the top of the hierarchy,
#                                       otherwise it does not change any
#                                       previous filter's action.
#               Required                Adds models if they are required by
#                                       Pro/ENGINEER, otherwise excludes
#                                       models from the collection.
#                      Issues for Required filter:
#                      1) In an assembly-to-assembly relation, the sub-assembly
#                         is considered to be required if it is in the parent's
#                         BOM.  If you remove a sub-assembly from the BOM in
#                         Teamcenter, the Integration will assume the
#                         sub-assembly is not required.
#                      2) The revision rule, selected in the Revision
#                         Configuration box, effects how the BOM is interpreted
#                         when applying the required filter.  Revision rules are
#                         applied to the BOM from the top down, but the revision
#                         rule is applied to the relations level by level.
#                         The inconsistency in the application of the revision
#                         rules can lead to unexpected results.  The most common
#                         confusion for users is caused by a precise clause at
#                         the beginning of a revision rule, which forces a
#                         precise BOM to be interpreted as precise even through
#                         a rule not implying precise (such as "Latest Working")
#                         is selected To get the desired behavior, a site should  
#                         create an integration specific revision rule (such as
#                         "IPEM - Latest Working"), which does not contain the
#                         precise working clause.  Use the
#                         iman.bomrevisionrule.allowed preference to ensure
#                         use of compliant revision rules.
#               Required Items          Adds models if they are required by
#                                       Pro/ENGINEER, plus their "implied
#                                       dependencies," i.e. models in the
#                                       same item revision.  Otherwise,
#                                       models are excluded from the
#                                       collection.  Note:  in an
#                                       assembly-to-assembly relation, the
#                                       sub-assembly is considered to be
#                                       required if it is in the parent's
#                                       BOM.  If you remove a sub-assembly
#                                       from the BOM in Teamcenter, the
#                                       Manager will assume the sub-assembly
#                                       is not required.
#               Suppressed              Adds a model if it is referenced by
#                                       a model in which it is suppressed,
#                                       otherwise it does not change any
#                                       previous filter's action.  (The
#                                       "Required" filter excludes suppressed
#                                       models.)
#
# filters.checkout.default = Required
#       List of filters to be checked by default in the "Filters" box.
#       Allowed value is a colon-separated string of the filter names
#       specified by the filters.checkout.choices option.  Filters
#       that are not in the filters.checkout.choices list are ignored.
#       With each new Open operation, filters are reset to their default
#       values, as determined by this preference.
#
# iman.autorevise.item = always
#       Option that controls whether selecting a different revision of
#       a model in the Open Dependencies dialog also selects that
#       revision for any other model with the same item ID.  Allowed
#       values are "always", "never", and "prompt".  When "always",
#       selecting a different revision in the Open Dependencies dialog
#       also selects that revision for other models with the same item
#       ID.  When "never", selecting a different revision in the Open
#       Dependencies dialog does not change the revision of other
#       models with the same item ID.  When "prompt", the user will be
#       asked whether the same revision should be selected for all
#       models with the same item ID.
#
# iman.bomrevisionrule.allowed
#       Option that lists the names of revision rules to show in the
#       menu of rules available to the user.  Allowed value is a
#       colon-separated list of revision rule names.  For example, a
#       list of two names such as
#
#           Latest Working:Precise Only
#
#       allows only the "Latest Working" and "Precise Only" revision
#       rules to be seen in the dialog.  If no value is given for this
#       option, all revision rules in Teamcenter will be
#       shown.  Non-existent rules are ignored.  The default rule,
#       specified by iman.bomrevisionruledefault, is always shown in
#       the menu, regardless of whether it is included in this list.
#
# iman.bomrevisionruledefault
#       Default BOM revision rule to use when searching imprecise BOMs
#       for item revisions.  Allowed value is a legal Teamcenter
#       BOM revision rule name.  If not specified,
#       Teamcenter's default revision rule is used.
#
# iman.bomrevisionrule.detail = false
#       Option that controls the detail shown in the "Rule Configured
#       By" column.  Allowed value is true or false.  When true, the
#       column shows the name of the rule entry that selected the
#       revision.  When false, the column shows only the name of the
#       rule.  True provides more information, but false allows faster
#       execution.
#
# iman.queries.allclasses = true
#       Option that selects queries for the Advanced Search dialog.
#       Allowed values are true and false.  If true, all queries
#       defined in Teamcenter are available in the Advanced Search
#       dialog, regardless of whether they can find Pro/ENGINEER
#       models.  If false, only queries that find folders, items, item
#       revisions, or datasets are shown (these are the only classes
#       that can lead to a Pro/ENGINEER model during a search).  This
#       option works in conjunction with the iman.queries.allowed
#       option, so a query permitted by iman.queries.allclasses will
#       be available in the Advanced Search dialog only if it is also
#       allowed by the iman.queries.allowed option.
#
# iman.queries.allowed
#       Option that lists the names of queries allowed in the Advanced
#       Search dialog.  Allowed value is a colon-separated list of
#       query names.  For example, a list of three names such as
#
#           Dataset...:Item - simple:Item...
#
#       allows only queries named "Dataset...", "Item - simple", and
#       "Item..." to be shown.  Queries whose names do not appear in
#       the list will not be shown in the Advanced Search dialog,
#       although if no value is given for this option, all queries are
#       allowed.  This list may include names that do not match any
#       queries in Teamcenter; those names will be ignored.  This
#       option works in conjunction with the iman.queries.allclasses
#       option, so a query permitted by iman.queries.allowed will be
#       available in the Advanced Search dialog only if it is also
#       allowed by the iman.queries.allclasses option.
#
# iman.queries.hidden = false
#       Option that selects queries for the Advanced Search dialog
#       according to whether their names begin with an underscore.
#       Allowed values are true and false.  If true, "hidden" queries
#       are included in the Advanced Search dialog.  A hidden query is
#       one whose name begins with an underscore.  If false, queries
#       whose names begin with an underscore are not shown in the
#       Advanced Search dialog.  The iman.queries.allowed option takes
#       precedence over this option such that queries specified in the
#       iman.queries.allowed list are shown in the Advanced Search
#       dialog and queries not in the list are excluded, regardless of
#       whether their names begin with an underscore and regardless of
#       whether iman.queries.hidden is true or false.  In other words,
#       iman.queries.hidden is effective only when iman.queries.allowed
#       is not specified.
#
# pe.checkout.autosuppress = false
#       Option that controls whether the user should be alerted if
#       missing components are suppressed while opening an assembly.
#       Allowed value is true or false.  Pro/ENGINEER automatically
#       suppresses missing components when opening an assembly from
#       Teamcenter, instead of entering resolve mode.  When true, this
#       happens silently, without alerting the user that components
#       are being suppressed.  When false, the user is notified if
#       components become suppressed while opening an assembly from
#       Teamcenter (users should consider erasing the assembly from
#       the Pro/ENGINEER session and using the File|Open command to
#       enter resolve mode).  This option is only available when
#       using Wildfire or later versions of Pro/ENGINEER.
#
# pe.loadall = false
#       Default value for the "Load All Fetched Models into Session"
#       checkbox in the Open dialog.  Allowed values are true and
#       false.  If true, all models exported from Teamcenter during an
#       Open operation are loaded into the Pro/ENGINEER session.  If
#       false, only models with a check in the Open column and those
#       that are needed by other models are loaded into the
#       Pro/ENGINEER session.
#
# table.columns.checkout
#       List of columns to display in the Open dialog and in the Open
#       Dependencies dialog.  Allowed value is a colon-separated
#       string of names, as described under the table.columns.std
#       option.  If not specified, the columns given by
#       table.columns.std are used.
# 
# -------------
# Cache Manager Dialog
# -------------
# pe.purge = 1
#       The default number of versions to keep when purging old
#       Pro/ENGINEER model versions.  Allowed value is an integer.  If
#       less than 1, purging files in the Cache Manager dialog will delete
#       all versions of the models.
#
# update.height = 600
#       Default height for the Update dialog, in pixels.
#
# update.width = 1000
#       Default width for the Update dialog, in pixels.
#
# update.table.autorefresh.interval = 0
#       Option to control the rate of auto-refresh for the Cache
#       Manager dialog.  The default value of 0 disables the auto-refresh.  
#       A positive value specifies the number of seconds between auto refresh 
#       calls.  A small value will ensure the user is promptly informed of 
#       changes, but could degrade the Teamcenter server performance.  The
#       degradation is proportional to the number of users and the the number
#       of files in each users cache (work folder).  The more files the more
#       impact on the server performance.  When a non-zero value is specified
#       for this preference the user can not observe the in-session status or
#       modification status of the models listed.
#
# table.columns.update
#       List of columns to display in the Cache Manager dialog.  Allowed
#       value is a colon-separated string of names, as described under
#       the table.columns.std option.  If not specified, the columns
#       given by table.columns.std are used.
#
# -------------
# Register New Dialog
# -------------
# registernew.enable = prompt
#       Preference to enable the user to register new Pro/ENGINEER models into
#       Teamcenter when they are created using the Pro/ENGINEER File->New
#       action.  When set to the default value of prompt, the user will be
#       prompted to register the model in Teamcenter.  If set to always, the
#       user would always get the dialog to register the model in Teamcenter
#       and could only by-pass by using cancel button.  If set to never, the
#       user will not have to register the model to Teamcenter until
#       performing a Teamcenter save.
#
# registernew.enable.manual.itemid = true
#       Preference to enable user to manually set the item ID.
#       If set to true, the user can manually enter value or use new
#       button.  If set to false, the user must select the "new" button
#       to obtain the item ID.  The default value is true.
#
# registernew.height = 650
#       Default height for the Register New dialog, in pixels.
# 
# registernew.width = 425
#       Default width for the Register New dialog, in pixels.
#
# -------------
# Table Display
# -------------
#
# table.columns.std = itemrev:genericname:reservedby:releasestatus
#       Default list of columns to display when a table is shown, if
#       no option is specified for a specific dialog (see the
#       table.columns.bom, table.columns.cancelcheckout,
#       table.columns.checkout and table.columns.update options).
#       table.columns.checkin must be used to configure the list of columns
#       for the Save Dialog.  table.columns.std is a colon-separated string
#       of names from the following list:
#               alternateid     Item's Alternate ID
#               cadname         Pro/ENGINEER model name.
#               cadtype         Pro/ENGINEER model type.
#               changeid        Checkout change ID if Pro/ENGINEER model
#                               is reserved.
#               comments        Checkout comments if Pro/ENGINEER model
#                               is reserved.
#               datasetdesc     Dataset description.
#               datasetname     Dataset name.
#               datasettype     Dataset type.
#               datasetversion  Dataset version.  This column contains
#                               a dropdown of all available
#                               dataset versions in the Open, Open
#                               Dependencies, and Update dialogs.  Can slow
#                               appearance of dialogs.  Recomended for
#                               administrator usage only.
#               filepath        Full path to the Pro/ENGINEER file.
#               genericname     Pro/ENGINEER model name of family table
#                               generic.  This column also displays an
#                               icon for models that are generics.
#                               Sorting the table on this column
#                               groups family members together.
#               group           Group that owns the dataset.
#               idcontext       IdContext name of the Alternate ID, defined 
#                               for an Item.
#               isincad         Flag for whether a version of the model
#                               exists in the Pro/ENGINEER session.
#               isinpdm         Flag for whether a version of the model
#                               already exists in Teamcenter.
#               itemdesc        Item description.
#               itemid          Item ID.
#               itemname        Item name.
#               itemrev         Item revision.
#               itemrevdesc     Item revision description.
#               itemtype        Item type.
#               latestrev       Latest item revision in the item.
#               moddate         Last modification date of the model's dataset.
#               namedref        Named reference for the Pro/ENGINEER file.
#               owner           User who owns the dataset.
#               releasestatus   Item revision or dataset release status.  If
#                               either item revision or dataset is released, the
#                               column will indicate released.
#               reservedby      Login ID of the user who has checked out
#                               the model's dataset.
#               rule            Revision rule that selected the item revision.
#                               This is similar to the "Rule Configured By"
#                               column in the Teamcenter Rich Client's PSE
#                               application.  The iman.bomrevisionrule.detail
#                               option controls the detail in this column.
#               site            Site that owns the dataset.
#               topgenericname  Pro/ENGINEER model name of family table
#                               top generic.  This column also
#                               displays an icon for models that are
#                               generics.  Sorting the table on this
#                               column groups family members together.
#               uom             Item unit of measure.
#
# table.columns.width = 100
#       Preferred column width, in pixels.  Allowed value is an
#       integer.  This is the default for most columns, but a column
#       may ignore this if the width is too small or too large for the
#       column, or if a preferred width has been assigned specifically
#       to that column.
#
# table.columns.width.NAME = -1
#       Preferred width for a specific column, in pixels, where "NAME"
#       is one of the names from the table.columns.std list above.
#       Allowed value is an integer.  Negative values imply a built-in
#       default should be used.  For example, to specify a default
#       width of 150 pixels for the "cadname" column, use:
#
#           table.columns.width.cadname = 150
#
#       In addition to the table.columns.std names, the following
#       names may be used for special columns:
#               cancel          The "Cancel" checkbox column in the
#                               Cancel Checkout dialog.
#               checkout        The "Checkout" checkbox column in the
#                               Open and Open Dependencies dialogs.
#               fetch           The "Fetch" checkbox column in the
#                               Open and Open Dependencies dialogs.
#               save            The "Save" checkbox column in the Save
#                               dialog.
#               tree            The "Tree" column in the Open Dependencies
#                               and Save dialogs.
#               workflow        The "Workflow" checkbox column in the Save
#                               dialog.
#       The preferred width may be ignored if it is too small or too
#       large for a column.
#
# table.tree.show = false
#       Default value of "Tree" button in the Save and Open
#       dialogs.  Allowed values are true and false to arrange tables
#       in a hierarchical tree view and in an ordinary table view,
#       respectively.  Note that some dialogs always display an ordinary
#       table view.
#
# table.hlines.show = false
#       Option that controls whether horizontal lines are drawn between
#       rows when a table is displayed.  Allowed values are true and
#       false.
#
# table.vlines.show = true
#       Option that controls whether vertical lines are drawn between
#       columns when a table is displayed.  Allowed values are true
#       and false.
#
# jt.top.node.only = false
#       Option that controls the creation of JT dataset for top node only
#       or for all nodes in an assembly.Allowed values are true
#       and false. JT is created for only top node if set to true.
#
# ---------------------
# Active Workspace
# ---------------------
# activeworkspace.enabled = false
#       Option that controls whether the Active Workspace client should
#       be enabled within the integration.  Only enable if Active Workspace
#       is installed.  Allowed values are true and false.
#
# activeworkspace.hosting.port = 3003
#       Starting port to try and start Active Workspace hosting server for the Creo browser tab.
#       If the port is blocked, the value is incremented by one until the 
#       activeworkspace.hosting.maxport value is reached. If no port is available, the Active 
#       Workspace hosting will not be enabled and no Creo Tab or menu pick will be available. The 
#       activeworkspace.enabled must be set to true to even attempt to start the Teamcenter 
#       Active Workspace hosting server. Port is freed when the Creo session is terminated. 
#       Default is "3003". 
#
# activeworkspace.hosting.maxport = 3006
#       Ending port to try to start Teamcenter Active Workspace hosting server for the Creo browser 
#       tab. This may be used when more than one Creo session is started by the user or when the 
#       activeworkspace.enabled port is blocked. See activeworkspace.hosting.port description.
#       Default "3006". 
#
